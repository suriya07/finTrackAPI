# Place at /etc/nginx/sites-available/fintrack-api and symlink into sites-enabled/.
# IP-only access for now — change `server_name` and run certbot once you have a domain.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health check — useful for AWS target groups or uptime monitors.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Allow somewhat large request bodies (e.g. image uploads later)
    client_max_body_size 10m;

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
